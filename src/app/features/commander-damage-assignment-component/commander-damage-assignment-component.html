@let commanders = playerCommanders();
@let targetDamageSources = targetPlayerDamageSources();

<div class="commander-damage-assignment-container">
@for (commander of commanders; track commander.id) {
    <div class="commander-damage-assignment">
        <value-step-component [value]="targetDamageSources[commander.id] ?? 0"
        (change)="updateCommanderDamage(commander.id, $event)"></value-step-component>
    </div>
}

</div>

<partner-toggle-component></partner-toggle-component>
